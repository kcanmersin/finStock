services:
  # -------------------------------------------------------
  # FastAPI Backend
  # -------------------------------------------------------
  backend:
    build: ./backend
    container_name: finstock-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------
  # Next.js Frontend  (opsiyonel — sadece backend istersen
  # bu servisi yorum satirina al veya kaldir)
  # -------------------------------------------------------
  frontend:
    build: ./front
    container_name: finstock-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
